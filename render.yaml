# Blueprint Render : API FastAPI + frontend statique.
# https://dashboard.render.com/blueprints
databases: []
services:
  - type: web
    name: novaerp-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: Nova ERP
      - key: API_PREFIX
        value: /api/v1
      - key: CORS_ORIGINS
        value: http://localhost:5173,https://novaerp-web.onrender.com
      - key: STORAGE_BUCKET
        value: erp-files
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false

  - type: web
    name: novaerp-web
    runtime: static
    plan: free
    region: frankfurt
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://novaerp-api.onrender.com/api/v1
